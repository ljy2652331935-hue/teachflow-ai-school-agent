<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Graph axes check for wave diagrams</title>
  <desc id="desc">A learning visual that shows pupils how to label time, frequency and amplitude axes before reading a graph.</desc>
  <rect width="960" height="540" rx="28" fill="#f8fafc"/>
  <rect x="42" y="42" width="876" height="456" rx="24" fill="#ffffff" stroke="#dbe4f0" stroke-width="2"/>
  <text x="78" y="94" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">Graph check: label the axes first</text>
  <text x="78" y="130" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="18">Before answering, ask: what does each axis measure?</text>

  <rect x="82" y="172" width="364" height="246" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="112" y="210" fill="#1d4ed8" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">Time-domain graph</text>
  <line x1="130" y1="358" x2="396" y2="358" stroke="#475569" stroke-width="3"/>
  <line x1="130" y1="358" x2="130" y2="254" stroke="#475569" stroke-width="3"/>
  <path d="M132 336 C164 260, 198 260, 230 336 S298 412, 330 336 S374 278, 396 318" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/>
  <rect x="262" y="372" width="72" height="28" rx="14" fill="#dbeafe"/>
  <text x="278" y="392" fill="#1e40af" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">time</text>
  <rect x="102" y="242" width="94" height="28" rx="14" fill="#dbeafe"/>
  <text x="116" y="262" fill="#1e40af" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">amplitude</text>

  <rect x="514" y="172" width="364" height="246" rx="18" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="544" y="210" fill="#047857" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">Frequency-domain graph</text>
  <line x1="560" y1="358" x2="826" y2="358" stroke="#475569" stroke-width="3"/>
  <line x1="560" y1="358" x2="560" y2="254" stroke="#475569" stroke-width="3"/>
  <rect x="602" y="314" width="40" height="44" rx="8" fill="#22c55e"/>
  <rect x="672" y="276" width="40" height="82" rx="8" fill="#2563eb"/>
  <rect x="742" y="330" width="40" height="28" rx="8" fill="#f59e0b"/>
  <rect x="650" y="372" width="102" height="28" rx="14" fill="#dcfce7"/>
  <text x="664" y="392" fill="#047857" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">frequency</text>
  <rect x="530" y="242" width="94" height="28" rx="14" fill="#dcfce7"/>
  <text x="544" y="262" fill="#047857" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">amount</text>

  <rect x="78" y="444" width="804" height="42" rx="21" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="108" y="471" fill="#9a3412" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800">Rule:</text>
  <text x="158" y="471" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="17">If the x-axis says time, read changes over time. If it says frequency, read the repeating parts.</text>
</svg>
