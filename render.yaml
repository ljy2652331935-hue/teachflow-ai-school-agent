services:
  - type: web
    name: qe-learning-demo
    runtime: node
    rootDir: outputs/teachflow-school-live
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: TEACHFLOW_WORKSPACE_FILE
        value: /tmp/teachflow-workspace-state.json
